---
name: Bug report
description: Report something broken in TeleZip
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: I redacted all secrets (no bot tokens, API hashes, or chat IDs anywhere in this report)
          required: true
  - type: input
    attributes:
      label: Version / tag
      description: e.g. v2.0.1, or commit hash if running from main
      placeholder: v2.0.1
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Path used
      options:
        - AIO (telezip_aio.py)
        - Legacy Unix (.sh)
        - Legacy Windows (.ps1)
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually happened (logs welcome, secrets removed)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python version, Docker version — whatever applies
